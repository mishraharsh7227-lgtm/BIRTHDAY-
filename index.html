<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nancy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #18243d 0%, #080b13 45%, #030509 100%);
    color: #f8f4e8;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 14px;
    border: 1px solid rgba(212,175,55,0.55);
    pointer-events: none;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    padding: 45px 25px;
    animation: appear 2s ease;
}

.crown {
    font-size: 38px;
    color: #d4af37;
    margin-bottom: 18px;
    animation: glow 3s infinite ease-in-out;
}

.small {
    letter-spacing: 5px;
    font-size: 12px;
    color: #c9b66b;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(34px, 10vw, 58px);
    letter-spacing: 3px;
    font-weight: normal;
    line-height: 1.15;
}

.name {
    color: #d4af37;
    margin-top: 8px;
}

.line {
    width: 100px;
    height: 1px;
    background: #d4af37;
    margin: 28px auto;
}

.date {
    font-size: 14px;
    letter-spacing: 4px;
    color: #cfc9b8;
    margin-bottom: 30px;
}

.card {
    background: rgba(12,16,27,0.75);
    border: 1px solid rgba(212,175,55,0.35);
    padding: 30px 22px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

.card h2 {
    color: #d4af37;
    font-size: 20px;
    font-weight: normal;
    margin-bottom: 18px;
}

.card p {
    color: #ddd8ca;
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.8;
}

.signature {
    margin-top: 25px;
    color: #d4af37 !important;
    font-family: Georgia, serif !important;
    font-style: italic;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #8e8b82;
    letter-spacing: 2px;
}

.sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #d4af37;
    border-radius: 50%;
    opacity: 0;
    animation: sparkle 4s infinite;
}

.s1 { top: 20%; left: 15%; animation-delay: 0s; }
.s2 { top: 70%; left: 12%; animation-delay: 1s; }
.s3 { top: 30%; right: 14%; animation-delay: 2s; }
.s4 { top: 80%; right: 18%; animation-delay: 3s; }

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glow {
    0%,100% {
        text-shadow: 0 0 5px rgba(212,175,55,0.2);
    }
    50% {
        text-shadow: 0 0 20px rgba(212,175,55,0.7);
    }
}

@keyframes sparkle {
    0%,100% {
        opacity: 0;
        transform: scale(0.5);
    }
    50% {
        opacity: 0.8;
        transform: scale(1.5);
    }
}
</style>
</head>

<body>

<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>

<main class="container">

    <div class="crown">♕</div>

    <div class="small">A SPECIAL DAY</div>

    <h1>HAPPY<br>BIRTHDAY</h1>

    <div class="name">NANCY</div>

    <div class="line"></div>

    <div class="date">27 • AUGUST • 2026</div>

    <section class="card">

        <h2>Dear Nancy,</h2>

        <p>
            Wishing you a beautiful birthday filled with
            happiness, laughter and wonderful moments.
            May the coming year bring you success,
            peace and everything you wish for.
        </p>

        <p class="signature">
            Stay happy. Stay blessed. ✨
        </p>

    </section>

    <div class="footer">
        WITH LOVE • ALWAYS
    </div>

</main>

</body>
</html>
